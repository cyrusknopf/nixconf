set -sg escape-time 0
set -g prefix C-space
# Status bar settings
set -g status-right "%a[%d] %l:%M"
set -g status-left-style bg=colour235,fg=colour136
set -g status-right-style fg=yellow,bg=default
set -g status-style bg=colour235,fg=colour136

# Vi mode for pane navigation
set -g mode-keys vi

# Pane navigation shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Clipboard support
bind-key -T copy-mode M-w send-keys -X copy-pipe 'reattach-to-user-namespace pbcopy'

# Set pane border colors
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour136

# Terminal compatibility
set -g default-terminal "screen-256color"

# Pane resizing with arrow keys
bind -r M-Up resize-pane -U 5
bind -r M-Down resize-pane -D 5
bind -r M-Left resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r C-Up resize-pane -U
bind -r C-Down resize-pane -D
bind -r C-Left resize-pane -L
bind -r C-Right resize-pane -R

set -g default-command "${SHELL} -l"

# List of plugins
#set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @rose_pine_variant 'moon' # Options are 'main', 'moon' or 'dawn'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
