# Status bar settings
set -g prefix C-space
set status-right "%a[%d] %l:%M"
set -g base-index 1
set -g history-limit 99999
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g escape-time 5

# Popups
# Quick git
bind g display-popup \
    -d "#{pane_current_path}" \
    -h 90% -w 70% \
    -E

# Help
bind C-h display-popup \
    -h 80% -w 80% \
    -E "tmux list-keys -T prefix | fzf --exact"

bind C-q display-popup \
    -h 80% -w 80% \
    -E 'sh -c "hx ~/.config/nix/configs/tmux.conf; tmux source-file ~/.tmux.conf"'

bind C-c

# Ferra Theme Tmux Configuration
# Color palette:
# Night: #2b292d, Ash: #383539, Umber: #4d424b, Bark: #6f5d63
# Mist: #d1d1e0, Sage: #b1b695, Blush: #fecdb2, Coral: #ffa07a
# Rose: #f6b6c9, Ember: #e06b75, Honey: #f5d76e
set status-right "%a[%d] %l:%M"
set status-left-style bg='#2b292d',fg='#f5d76e'
set status-right-style fg='#ffa07a',bg='#2b292d'
set status-style bg='#2b292d',fg='#d1d1e0'
# Set pane border colors
set pane-border-style fg='#4d424b'
set pane-active-border-style fg='#f5d76e'
# Optional: Additional status line styling for better integration
set message-style bg='#383539',fg='#d1d1e0'
set message-command-style bg='#383539',fg='#d1d1e0'
set mode-style bg='#f5d76e',fg='#2b292d'

# Vi mode for pane navigation
set mode-keys vi
set-window-option -g mode-keys vi

# Pane navigation shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Clipboard support
bind-key -T copy-mode M-w send-keys -X copy-pipe 'reattach-to-user-namespace pbcopy'

# Terminal compatibility
set -g default-terminal "xterm-256color"

# Pane resizing with arrow keys
bind -r M-Up resize-pane -U 5
bind -r M-Down resize-pane -D 5
bind -r M-Left resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r C-Up resize-pane -U
bind -r C-Down resize-pane -D
bind -r C-Left resize-pane -L
bind -r C-Right resize-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'laktak/extrakto'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
